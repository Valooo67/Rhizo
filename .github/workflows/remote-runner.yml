name: RHIZO Remote Runner

on:
  push:
    branches: [main]
    paths:
      - ".remote-runner/request.sh"

permissions:
  contents: read

concurrency:
  group: rhizo-remote-runner
  cancel-in-progress: false

jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc spirv-tools
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358"

      - name: Run requested terminal commands
        shell: bash
        run: |
          set +e
          mkdir -p .remote-runner
          bash .remote-runner/request.sh 2>&1 | tee .remote-runner/terminal.log
          status=${PIPESTATUS[0]}
          echo "$status" > .remote-runner/exit-code.txt
          exit "$status"

      - name: Upload terminal output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhizo-terminal-output
          path: |
            .remote-runner/terminal.log
            .remote-runner/exit-code.txt
          if-no-files-found: warn
