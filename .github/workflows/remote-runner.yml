name: RHIZO Remote Runner

on:
  push:
    branches: [main]
    paths:
      - ".remote-runner/request.sh"

permissions:
  contents: read

concurrency:
  group: rhizo-remote-runner
  cancel-in-progress: false

jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-tools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Run requested terminal commands
        shell: bash
        run: |
          set +e
          bash .remote-runner/request.sh 2>&1 | tee terminal.log
          status=${PIPESTATUS[0]}
          echo "$status" > exit-code.txt
          exit "$status"

      - name: Upload terminal output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhizo-terminal-output
          path: |
            terminal.log
            exit-code.txt
          if-no-files-found: warn
