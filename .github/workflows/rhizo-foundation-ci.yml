name: RHIZO Foundation Build
on:
  push:
    branches:
      - engine-foundation-scene-resources
  pull_request:
    branches:
      - renderer-stage-hdr-shadows-instancing-lod
jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and shader tools
        run: |
          sdkmanager "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslc spirv-tools
      - name: Configure RHIZO
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build RHIZO
        run: cmake --build build --parallel 2
      - name: Validate embedded shader modules
        run: |
          find build -name '*.spv' -print0 | while IFS= read -r -d '' shader; do spirv-val --target-env vulkan1.1 "$shader"; done
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: rhizo-foundation-arm64
          path: build/librhizo.so
          if-no-files-found: error
